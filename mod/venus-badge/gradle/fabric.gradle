// Lo que comparten las compilaciones de Fabric (Loom con los nombres de Yarn).
apply from: rootProject.file('gradle/loader.gradle')

sourceSets.main.java.srcDir rootProject.file('shared-yarn/java')

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	// El launcher instala un solo .jar y la instancia puede no tener Fabric API, pero sin su módulo de recursos Fabric no carga
	// los assets de ningún mod: la fuente de la insignia no existiría y se vería un cuadradito en vez del planeta. Por eso ese
	// módulo y el base que necesita van adentro del .jar; si la instancia tiene Fabric API, Fabric Loader usa la versión más nueva.
	['fabric-api-base', 'fabric-resource-loader-v0'].each { module ->
		def dep = fabricApi.module(module, fabric_api_version)
		modImplementation dep
		include dep
	}
}

java {
	sourceCompatibility = JavaVersion.toVersion(java_release)
	targetCompatibility = JavaVersion.toVersion(java_release)
}

// El .jar que va al launcher: Loom lo pasa a los nombres de intermediary.
ext.finalJar = tasks.named('remapJar')
