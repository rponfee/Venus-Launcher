# Mod de la insignia de Venus (ver README.md). Lo compila .github/workflows/mod.yml y el launcher lo instala en las
# instancias Fabric compatibles cuando el jugador prende la insignia (src/main/modules/ingame/badgemod.js).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric para Minecraft 1.21.1 (sirve también para 1.21; la 1.21.2 cambió cómo se dibujan los nombres)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
loom_version=1.19.3

# Mod
mod_version=1.0.0
maven_group=com.venuslauncher
archives_base_name=venus-badge
