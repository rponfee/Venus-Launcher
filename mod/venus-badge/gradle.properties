# Mod de la insignia de Venus (ver README.md). Lo compila .github/workflows/mod.yml y el launcher lo instala en las
# instancias compatibles cuando el jugador prende la insignia (src/main/modules/ingame/badgemod.js).
# Lo propio de cada compilación (versión de Minecraft, mappings, Java) está en <subproyecto>/gradle.properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Plugins de Gradle: Loom para Fabric; ModDevGradle para NeoForge y, con su plugin "legacyforge", para Forge 1.20.1
loom_version=1.19.3
moddev_version=2.0.148

# Mod
mod_version=1.2.0
maven_group=com.venuslauncher
archives_base_name=venus-badge
