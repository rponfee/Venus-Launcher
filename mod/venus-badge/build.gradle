// Raíz del mod: el código común a todos los loaders (caché, cliente HTTP, estilos: nada de Minecraft) y sus pruebas.
// Las carpetas fabric-*, neoforge-* y forge-* son los subproyectos que compilan cada .jar (ver README.md).
plugins {
	id 'java'
}

// Los subproyectos dicen cuál es su .jar final (ext.finalJar) al evaluarse.
evaluationDependsOnChildren()

version = mod_version
group = maven_group

repositories {
	mavenCentral()
}

// Gson y SLF4J vienen con Minecraft (1.20.1 en adelante, en todos los loaders): acá hacen falta solo para compilar y probar.
dependencies {
	compileOnly 'com.google.code.gson:gson:2.10'
	compileOnly 'org.slf4j:slf4j-api:2.0.1'

	testImplementation 'com.google.code.gson:gson:2.10'
	testImplementation 'org.slf4j:slf4j-api:2.0.1'
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// La versión de Java más vieja que usa alguna compilación: el código común tiene que servir para todas.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

// La raíz no da un mod: solo los subproyectos.
jar {
	enabled = false
}

// Junta los .jar en build/libs como venus-badge-<versión>+mc<minecraft>-<loader>.jar: de ahí los toman mod.yml y
// scripts/build-badge-mod.js, y el launcher los busca como venus-badge-mc<minecraft>-<loader>.jar (badgemod.js, BUILDS).
def collectJars = tasks.register('collectJars', Sync) {
	into layout.buildDirectory.dir('libs')
	subprojects.each { p ->
		from(p.finalJar) {
			rename { "${archives_base_name}-${p.version}-${p.loader_name}.jar" }
		}
	}
}

build.dependsOn collectJars
