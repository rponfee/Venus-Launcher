name: Compare Admin Translation Models
on:
  push:
    branches: [preview/openai-instance-groups-4.6.3-beta.1]
    paths: [.github/workflows/translation-sample.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install translation models
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.50,<5' sentencepiece
      - name: Translate sample admin actions
        shell: bash
        run: |
          python - <<'PY'
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          torch.set_num_threads(4)
          samples = [
            'Mute {count} users', 'Muted forever', 'Mute reason: {reason}',
            'Unban {count} users?', 'This cannot be undone.',
            'Paste your sk-… key', 'Paste the CurseForge API key',
          ]
          for lang in ('de', 'fr', 'zh'):
            name = f'Helsinki-NLP/opus-mt-en-{lang}'
            print(f'== {lang} / {name} ==', flush=True)
            try:
                tokenizer = AutoTokenizer.from_pretrained(name)
                model = AutoModelForSeq2SeqLM.from_pretrained(name).eval()
                encoded = tokenizer(samples, return_tensors='pt', padding=True, truncation=True)
                with torch.inference_mode():
                    translated = model.generate(**encoded, max_new_tokens=80, num_beams=4)
                for src, dst in zip(samples, tokenizer.batch_decode(translated, skip_special_tokens=True)):
                    print(f'{src} => {dst}', flush=True)
                del model
            except Exception as exc:
                print(f'ERROR {type(exc).__name__}: {str(exc)[:250]}', flush=True)
          PY
