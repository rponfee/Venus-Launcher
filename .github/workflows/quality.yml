name: Quality

on:
  pull_request:
  push:
    branches:
      - feature/venus-6.0-safety

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check.js
      - run: node scripts/i18n-check.js
      - run: node scripts/contracts-check.js
      - run: node --test "src/main/modules/sharedoptions/test/*.test.js" "src/main/modules/preflight/test/*.test.js" "src/main/modules/updater/test/*.test.js"
