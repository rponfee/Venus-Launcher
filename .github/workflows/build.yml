# Compila Venus Launcher desde el código fuente en un runner de GitHub, sube los ejecutables como artefacto y,
# cuando SignPath está configurado, los manda a firmar. Corre al subir un tag v* (por ejemplo v1.0.13) o a mano
# desde la pestaña Actions. Con un tag, además publica la release de GitHub con VenusLauncher-Setup.exe,
# VenusLauncher-Portable.exe y latest.yml (nombres fijos: los links releases/latest/download/… bajan siempre
# la última versión y los launchers instalados se actualizan solos). El tag tiene que coincidir con la
# versión de package.json.
#
# Para activar la firma (después de que SignPath Foundation apruebe el proyecto), cargá en Settings > Secrets and
# variables > Actions del repositorio:
#   - secreto  SIGNPATH_API_TOKEN            token de un usuario de SignPath con permiso de "submitter"
#   - variable SIGNPATH_ORGANIZATION_ID      id de la organización en SignPath
#   - variable SIGNPATH_PROJECT_SLUG         slug del proyecto (por ejemplo venus-launcher)
#   - variable SIGNPATH_SIGNING_POLICY_SLUG  slug de la política de firma (por ejemplo release-signing)
# Docs: https://docs.signpath.io/trusted-build-systems/github
#
# Firma de Microsoft (Azure Artifact Signing, antes "Trusted Signing"; guía en docs/firma-microsoft.md): con
# AZURE_SIGNING_ENDPOINT cargada, electron-builder firma al compilar el ejecutable de la app, el desinstalador, el
# instalador y la versión portable, y arma latest.yml y el .blockmap con los archivos ya firmados. Tiene prioridad:
# con ella cargada, el paso de SignPath no corre.
#   - secretos  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  (app registrada en Entra ID con el rol
#               "Artifact Signing Certificate Profile Signer" en la cuenta de firma)
#   - variable  AZURE_SIGNING_ENDPOINT   por ejemplo https://eus.codesigning.azure.net/ (según la región)
#   - variable  AZURE_SIGNING_ACCOUNT    nombre de la cuenta de firma
#   - variable  AZURE_SIGNING_PROFILE    nombre del perfil de certificado
#   - variable  AZURE_SIGNING_PUBLISHER  nombre del editor tal cual figura en el certificado (CN). Va a app-update.yml:
#               las versiones firmadas solo aceptan actualizaciones firmadas con ese mismo nombre
# Las releases que ya estaban publicadas se firman con resign-releases.yml.
# Sin ninguna de las dos configuraciones el workflow compila y publica sin firmar.
name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write # para publicar la release cuando se sube un tag

jobs:
  # Mod de la insignia de Venus (mod/venus-badge): va empaquetado en el launcher y como archivo de la release.
  mod:
    uses: ./.github/workflows/mod.yml

  build:
    needs: mod
    # SignPath solo firma lo que se compiló en runners alojados por GitHub.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bajar el mod de la insignia
        uses: actions/download-artifact@v7
        with:
          name: venus-badge-mod
          path: src/main/modules/ingame/mods

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Cada comando corta el paso si falla. Las pruebas que fallan se publican como anotaciones
      # (scripts/ci-annotate.js), que se ven sin iniciar sesión; el registro completo, no.
      - name: Chequeos
        shell: pwsh
        run: |
          node scripts/check.js
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=check.js::Hay errores de sintaxis (ver node scripts/check.js).'; exit 1 }
          node scripts/contracts-check.js
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=contracts-check.js::Hay canales de la interfaz sin handler.'; exit 1 }
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-results.tap supabase/functions/payments/tests/payments.test.ts supabase/functions/voice-turn/tests/voice-turn.test.ts supabase/functions/badge/tests/badge.test.ts src/main/modules/billing/test/client.test.js src/main/modules/support/test/client.test.js "src/main/modules/recap/test/*.test.js" "src/main/modules/skins/test/*.test.js" "src/main/modules/mcimport/test/*.test.js" "src/main/modules/svcstatus/test/*.test.js" "src/main/modules/ingame/test/*.test.js"
          $code = $LASTEXITCODE
          if ($code -ne 0) { node scripts/ci-annotate.js test-results.tap; exit $code }

      # Con la firma de Microsoft configurada, la configuración de firma se pasa solo acá (con -c): en una PC sin
      # credenciales de Azure `npm run dist` sigue compilando sin firmar.
      - name: Compilar instalador y versión portable
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $firma = @()
          if ($env:AZURE_SIGNING_ENDPOINT) {
            $firma = @(
              "-c.win.azureSignOptions.endpoint=$env:AZURE_SIGNING_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGNING_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_SIGNING_PROFILE",
              "-c.win.azureSignOptions.publisherName=$env:AZURE_SIGNING_PUBLISHER"
            )
          }
          npx electron-builder --win --x64 --publish never @firma
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:AZURE_SIGNING_ENDPOINT) {
            foreach ($f in 'dist/VenusLauncher-Setup.exe', 'dist/VenusLauncher-Portable.exe', 'dist/win-unpacked/Venus Launcher.exe') {
              $sig = Get-AuthenticodeSignature $f
              if ($sig.Status -ne 'Valid') { Write-Output "::error title=Firma de Microsoft::$f no quedó firmado ($($sig.Status))"; exit 1 }
              Write-Output "$f firmado por $($sig.SignerCertificate.Subject)"
            }
          }

      # Los dos .exe van sueltos en la raíz del zip del artefacto (la configuración de artefacto de SignPath
      # tiene que tener <zip-file> como raíz).
      - name: Subir el artefacto sin firmar
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: VenusLauncher-unsigned
          path: |
            dist/VenusLauncher-Setup*.exe
            dist/VenusLauncher-Portable*.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.AZURE_SIGNING_ENDPOINT == '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Cada firma necesita la aprobación manual de un Approver.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      # Firmar cambia el instalador: latest.yml (actualización automática) se rearma con el archivo firmado.
      - name: latest.yml del instalador firmado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.AZURE_SIGNING_ENDPOINT == '' }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-signed -Filter 'VenusLauncher-Setup*.exe' | Select-Object -First 1
          node scripts/latest-yml.js $setup.FullName dist-signed/latest.yml

      - name: Subir el artefacto firmado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.AZURE_SIGNING_ENDPOINT == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: VenusLauncher-signed
          path: dist-signed/
          if-no-files-found: error

      # Con los archivos firmados por SignPath si hubo esa firma; si no, con los de dist (sin firmar o firmados por
      # Microsoft al compilar). El .blockmap (descargas diferenciales del actualizador) solo sirve en dist: la firma
      # de SignPath cambia el archivo después de armarlo.
      - name: Publicar la release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "El tag $env:TAG no coincide con la versión $version de package.json" }
          $origen = if (Test-Path dist-signed) { 'dist-signed' } else { 'dist' }
          $archivos = @("$origen/VenusLauncher-Setup.exe", "$origen/VenusLauncher-Portable.exe", "$origen/latest.yml")
          if ($origen -eq 'dist') { $archivos += "$origen/VenusLauncher-Setup.exe.blockmap" }
          # El mod de la insignia (el mismo .jar que va dentro del launcher), para instalarlo a mano o en Modrinth
          $archivos += (Get-ChildItem src/main/modules/ingame/mods -Filter 'venus-badge-mc*.jar').FullName
          foreach ($a in $archivos) { if (-not (Test-Path $a)) { throw "Falta $a" } }
          $notas = @(
            "Instalador y versión portable de Venus Launcher $version para Windows 10 y 11 (64 bits).",
            "",
            "- [Code signing policy](https://github.com/$env:REPO#code-signing-policy)",
            "- [Privacy policy](https://github.com/$env:REPO#privacy-policy)",
            "- [Funciones y guía](https://github.com/$env:REPO#readme)"
          ) -join "`n"
          gh release view $env:TAG --repo $env:REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $archivos --repo $env:REPO --clobber
          } else {
            gh release create $env:TAG $archivos --repo $env:REPO --title "Venus Launcher $version" --notes $notas
          }
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la release" }
