# Configuracion minima para la CLI de Supabase (supabase functions deploy).
# stripe-webhook recibe los avisos de Stripe, que no mandan un JWT de Supabase:
# la funcion verifica la firma de Stripe por su cuenta.
project_id = "dzchklzaxyygbvfpagvx"

[functions.stripe-webhook]
verify_jwt = false

# GET publica VAPID; POST verifica x-venus-push-secret dentro de la función.
[functions.push-notify]
verify_jwt = false

# CurseForge requiere una sesión de usuario y acceso autorizado por la RPC.
[functions.curseforge]
verify_jwt = true
